
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}

.qr-root{
  font-family:'Syne',sans-serif;
  padding:2rem 1.5rem 2.5rem;
  max-width:560px;
  margin:0 auto;
}

.qr-header{
  margin-bottom:2rem;
}
.qr-eyebrow{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.12em;
  color:var(--color-text-tertiary);
  text-transform:uppercase;
  margin-bottom:4px;
}
.qr-title{
  font-size:28px;
  font-weight:800;
  color:var(--color-text-primary);
  line-height:1.1;
}
.qr-title span{
  color:#1D9E75;
}

.type-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:1.75rem;
}
.type-btn{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  padding:6px 14px;
  border-radius:100px;
  border:1.5px solid var(--color-border-tertiary);
  background:transparent;
  color:var(--color-text-secondary);
  cursor:pointer;
  transition:all 0.15s ease;
}
.type-btn:hover{
  border-color:var(--color-border-secondary);
  color:var(--color-text-primary);
}
.type-btn.active{
  background:#1D9E75;
  border-color:#1D9E75;
  color:#fff;
}

.fields-wrap{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:1.5rem;
}
.field-group{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field-label{
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--color-text-tertiary);
}
.field-input{
  font-family:'DM Mono',monospace;
  font-size:13px;
  padding:10px 14px;
  border-radius:10px;
  border:1.5px solid var(--color-border-tertiary);
  background:var(--color-background-secondary);
  color:var(--color-text-primary);
  width:100%;
  transition:border-color 0.15s;
  outline:none;
}
.field-input:focus{border-color:#1D9E75;}
textarea.field-input{resize:vertical;min-height:72px;line-height:1.5;}

.opts-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:1.75rem;
}
.opt-group{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.color-swatch{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 14px;
  border-radius:10px;
  border:1.5px solid var(--color-border-tertiary);
  background:var(--color-background-secondary);
  cursor:pointer;
}
.color-swatch input[type=color]{
  width:22px;height:22px;
  border:none;background:none;
  padding:0;cursor:pointer;
  border-radius:50%;
}
.color-val{
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--color-text-secondary);
}
.size-select{
  font-family:'DM Mono',monospace;
  font-size:12px;
  padding:10px 14px;
  border-radius:10px;
  border:1.5px solid var(--color-border-tertiary);
  background:var(--color-background-secondary);
  color:var(--color-text-primary);
  width:100%;
  outline:none;
  cursor:pointer;
}

.preview-card{
  border-radius:16px;
  border:1.5px solid var(--color-border-tertiary);
  background:var(--color-background-secondary);
  padding:1.5rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1rem;
  min-height:200px;
  justify-content:center;
}
.preview-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.preview-icon{
  width:48px;height:48px;
  border:2px dashed var(--color-border-secondary);
  border-radius:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:4px;
  padding:8px;
}
.preview-icon span{
  background:var(--color-border-secondary);
  border-radius:2px;
}
.preview-icon span:nth-child(4){opacity:0;}
.preview-empty p{
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--color-text-tertiary);
  letter-spacing:0.06em;
}
#qr-canvas{border-radius:8px;display:none;}

.dl-btn{
  font-family:'DM Mono',monospace;
  font-size:12px;
  letter-spacing:0.08em;
  padding:10px 24px;
  border-radius:100px;
  border:1.5px solid #1D9E75;
  background:#1D9E75;
  color:#fff;
  cursor:pointer;
  display:none;
  transition:opacity 0.15s;
}
.dl-btn:hover{opacity:0.85;}

.content-label{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:var(--color-text-tertiary);
  letter-spacing:0.08em;
  max-width:240px;
  text-align:center;
  word-break:break-all;
  line-height:1.6;
}
</style>

<div class="qr-root">
  <div class="qr-header">
    <p class="qr-eyebrow">Herramienta</p>
    <h1 class="qr-title">Genera tu<br><span>código QR</span></h1>
  </div>

  <div class="type-row" id="type-row"></div>
  <div class="fields-wrap" id="fields-wrap"></div>

  <div class="opts-row">
    <div class="opt-group">
      <span class="field-label">Color</span>
      <div class="color-swatch" onclick="document.getElementById('qr-color').click()">
        <input type="color" id="qr-color" value="#0F6E56" onchange="onColorChange()">
        <span class="color-val" id="color-val">#0F6E56</span>
      </div>
    </div>
    <div class="opt-group">
      <span class="field-label">Tamaño</span>
      <select class="size-select" id="qr-size" onchange="renderQR()">
        <option value="200">Pequeño — 200px</option>
        <option value="300" selected>Mediano — 300px</option>
        <option value="400">Grande — 400px</option>
      </select>
    </div>
  </div>

  <div class="preview-card" id="preview-card">
    <div class="preview-empty" id="preview-empty">
      <div class="preview-icon">
        <span></span><span></span><span></span><span></span>
      </div>
      <p>ingresa contenido arriba</p>
    </div>
    <canvas id="qr-canvas"></canvas>
    <p class="content-label" id="content-label" style="display:none"></p>
    <button class="dl-btn" id="dl-btn" onclick="downloadQR()">Descargar PNG</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let currentType='url';

const types=[
  {id:'url',label:'URL'},
  {id:'text',label:'Texto'},
  {id:'email',label:'Email'},
  {id:'phone',label:'Tel'},
  {id:'wifi',label:'WiFi'},
];

const templates={
  url:[{id:'url',label:'Enlace',ph:'https://ejemplo.com',t:'text'}],
  text:[{id:'text',label:'Mensaje',ph:'Escribe aquí...',t:'area'}],
  email:[
    {id:'email',label:'Correo',ph:'correo@ejemplo.com',t:'text'},
    {id:'subject',label:'Asunto (opcional)',ph:'Hola',t:'text'},
    {id:'body',label:'Mensaje (opcional)',ph:'...',t:'area'}
  ],
  phone:[{id:'phone',label:'Número',ph:'+521234567890',t:'text'}],
  wifi:[
    {id:'ssid',label:'Nombre de red',ph:'MiRed',t:'text'},
    {id:'pass',label:'Contraseña',ph:'••••••••',t:'text'},
    {id:'enc',label:'Seguridad',ph:'',t:'select',opts:['WPA','WEP','Sin contraseña']}
  ]
};

function buildTypeRow(){
  const row=document.getElementById('type-row');
  row.innerHTML='';
  types.forEach(t=>{
    const b=document.createElement('button');
    b.className='type-btn'+(t.id===currentType?' active':'');
    b.textContent=t.label;
    b.onclick=()=>setType(t.id);
    row.appendChild(b);
  });
}

function setType(t){
  currentType=t;
  buildTypeRow();
  renderFields();
  clearQR();
}

function renderFields(){
  const wrap=document.getElementById('fields-wrap');
  wrap.innerHTML='';
  templates[currentType].forEach(f=>{
    const g=document.createElement('div');
    g.className='field-group';
    const lbl=document.createElement('span');
    lbl.className='field-label';
    lbl.textContent=f.label;
    g.appendChild(lbl);
    let el;
    if(f.t==='area'){
      el=document.createElement('textarea');
      el.className='field-input';
      el.placeholder=f.ph;
    } else if(f.t==='select'){
      el=document.createElement('select');
      el.className='field-input size-select';
      f.opts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;el.appendChild(op);});
    } else {
      el=document.createElement('input');
      el.type='text';
      el.className='field-input';
      el.placeholder=f.ph;
    }
    el.id='f-'+f.id;
    el.addEventListener('input',renderQR);
    el.addEventListener('change',renderQR);
    g.appendChild(el);
    wrap.appendChild(g);
  });
}

function getContent(){
  const v=id=>{const el=document.getElementById('f-'+id);return el?el.value.trim():'';};
  switch(currentType){
    case'url':return v('url');
    case'text':return v('text');
    case'phone':return v('phone')?'tel:'+v('phone'):'';
    case'email':{
      const e=v('email');if(!e)return'';
      let s='mailto:'+e;
      const p=[];
      if(v('subject'))p.push('subject='+encodeURIComponent(v('subject')));
      if(v('body'))p.push('body='+encodeURIComponent(v('body')));
      return p.length?s+'?'+p.join('&'):s;
    }
    case'wifi':{
      const ssid=v('ssid');if(!ssid)return'';
      const enc=v('enc')==='Sin contraseña'?'nopass':v('enc');
      return`WIFI:T:${enc};S:${ssid};P:${v('pass')};;`;
    }
  }
  return'';
}

function onColorChange(){
  const c=document.getElementById('qr-color').value;
  document.getElementById('color-val').textContent=c;
  renderQR();
}

function clearQR(){
  document.getElementById('qr-canvas').style.display='none';
  document.getElementById('dl-btn').style.display='none';
  document.getElementById('content-label').style.display='none';
  document.getElementById('preview-empty').style.display='flex';
}

function renderQR(){
  const content=getContent();
  if(!content){clearQR();return;}
  const color=document.getElementById('qr-color').value;
  const size=parseInt(document.getElementById('qr-size').value);
  const canvas=document.getElementById('qr-canvas');
  document.getElementById('preview-empty').style.display='none';

  try{
    const tmp=document.createElement('div');
    new QRCode(tmp,{text:content,width:size,height:size,colorDark:color,colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
    setTimeout(()=>{
      const img=tmp.querySelector('img')||tmp.querySelector('canvas');
      if(!img)return;
      const ctx=canvas.getContext('2d');
      canvas.width=size;canvas.height=size;
      const draw=()=>{
        ctx.drawImage(img,0,0,size,size);
        canvas.style.display='block';
        document.getElementById('dl-btn').style.display='inline-block';
        const lbl=document.getElementById('content-label');
        lbl.textContent=content.length>60?content.slice(0,57)+'…':content;
        lbl.style.display='block';
      };
      if(img.complete)draw();else img.onload=draw;
    },80);
  }catch(e){}
}

function downloadQR(){
  const a=document.createElement('a');
  a.download='codigo-qr.png';
  a.href=document.getElementById('qr-canvas').toDataURL('image/png');
  a.click();
}

buildTypeRow();
renderFields();
</script>
